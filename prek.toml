# Checks that hold for the tree as it is. ggml/ is a vendored upstream tree and
# patches/ holds diffs whose whitespace is part of the patch, so both stay out.
exclude = "^(ggml/|patches/)"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
]

# Pyflakes and syntax errors, then ruff's default formatting.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"
hooks = [
  { id = "ruff-check", args = ["--isolated", "--select", "E9,F"] },
  { id = "ruff-format", args = ["--isolated"] },
]

# The style lives in .clang-format.
[[repos]]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v22.1.8"
hooks = [
  { id = "clang-format", types_or = ["c", "c++"] },
]

[[repos]]
repo = "local"
hooks = [
  # gofmt -l exits 0 even when it lists files, so turn its list into a failure.
  { id = "gofmt", name = "gofmt", language = "system", entry = "bash -c 'out=$(gofmt -l \"$@\"); [ -z \"$out\" ] || { echo \"$out\"; exit 1; }' --", files = "\\.go$" },
]
